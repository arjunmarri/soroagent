<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoroAgent snippets</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    body { overflow-y: scroll; }
    main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .toolbar input[type="search"] { flex: 1 1 260px; width: auto; }
    .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
    .segmented button { border: none; background: none; padding: 7px 12px; font: inherit; font-size: 13px; color: var(--fg-muted); cursor: pointer; }
    .segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .label { font-size: 12px; color: var(--fg-muted); margin-right: 2px; }
    .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; }
    details.more { position: relative; }
    details.more summary { list-style: none; cursor: pointer; }
    details.more summary::-webkit-details-marker { display: none; }
    details.more .menu { position: absolute; right: 0; top: 38px; z-index: 5; display: grid; gap: 4px; padding: 6px; min-width: 190px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.15); }
    details.more .menu .btn { justify-content: flex-start; }

    /* Two panes: the list and the reading view */
    .layout { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 22px; align-items: start; }
    .list { display: grid; gap: 6px; }
    .group-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: baseline; padding: 10px 4px 6px; background: var(--bg); font-weight: 650; font-size: 13.5px; }
    .group-head small { font-weight: 400; color: var(--fg-muted); }
    .card {
      display: grid; gap: 4px; text-align: left; width: 100%; padding: 11px 13px; border-radius: 12px; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); color: var(--fg); font: inherit;
    }
    .card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .card-title { font-weight: 620; font-size: 14.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-summary { font-size: 13px; color: var(--fg-muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; font-size: 12px; color: var(--fg-muted); }
    .avatar { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-weight: 700; color: #fff; flex: none; }
    .site { display: inline-flex; align-items: center; gap: 5px; }
    .kind { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; background: var(--surface-soft); color: var(--fg-muted); }
    .kind.summary { background: color-mix(in srgb, #34D399 18%, transparent); color: #0f9f6e; }
    .kind.research { background: var(--accent-soft); color: var(--accent); }
    .has-research { color: var(--accent); }

    /* Reading view */
    .reader { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 34px 34px; }
    .reader-empty { color: var(--fg-muted); text-align: center; padding: 60px 20px; }
    .reader h1 { font-size: 24px; line-height: 1.25; margin: 6px 0 10px; letter-spacing: -0.015em; }
    .reader .meta { font-size: 13px; margin-bottom: 4px; }
    .reader .tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
    .prose { font-size: 16px; line-height: 1.7; max-width: 70ch; margin-top: 18px; }
    .prose p, .prose ul, .prose ol { margin: 0 0 14px; }
    .prose ul, .prose ol { padding-left: 22px; }
    .prose li { margin: 4px 0; }
    .prose h3, .prose h4, .prose h5 { font-size: 17px; margin: 22px 0 8px; }
    .prose strong { font-weight: 650; }
    .prose blockquote, .quote { margin: 0 0 14px; padding: 4px 0 4px 16px; border-left: 3px solid var(--border); color: var(--fg-muted); white-space: pre-wrap; }
    .section-title { display: flex; align-items: center; gap: 10px; margin: 30px 0 4px; padding-top: 22px; border-top: 1px solid var(--border); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-muted); }
    .sources { padding-left: 22px; margin: 6px 0 0; font-size: 14px; }
    .sources li { margin: 4px 0; }
    .sources small { color: var(--fg-muted); }
    .reader-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .working { display: flex; align-items: center; gap: 8px; color: var(--fg-muted); font-size: 14px; margin-top: 12px; }
    .working::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    .problem { color: var(--err); margin-top: 12px; }
    .back { display: none; }
    .empty { text-align: center; padding: 48px 16px; color: var(--fg-muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .reader { display: none; position: fixed; inset: 0; z-index: 10; max-height: none; border-radius: 0; padding: 18px 18px 40px; }
      .reader.open { display: block; }
      .back { display: inline-flex; margin-bottom: 8px; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand"><picture><source srcset="../icons/dark/icon-48.png" media="(prefers-color-scheme: dark)"><img src="../icons/icon-48.png" alt=""></picture>Snippets <span class="muted" id="count"></span></div>
    <div class="row"><a class="btn small" href="history.html">Summary history</a><a class="btn small" href="options.html">Settings</a></div>
  </header>
  <div class="toolbar">
    <input type="search" id="search" placeholder="Search snippets, research, sites and tags…" aria-label="Search snippets">
    <span class="label">Group by</span>
    <div class="segmented" role="group" aria-label="Group by">
      <button type="button" data-group="day" aria-pressed="true">Day</button>
      <button type="button" data-group="site" aria-pressed="false">Site</button>
      <button type="button" data-group="topic" aria-pressed="false">Topic</button>
    </div>
    <div class="segmented" role="group" aria-label="Show">
      <button type="button" data-kind="all" aria-pressed="true">All</button>
      <button type="button" data-kind="summary" aria-pressed="false">Summaries</button>
      <button type="button" data-kind="selection" aria-pressed="false">Selections</button>
      <button type="button" data-kind="research" aria-pressed="false">Research</button>
    </div>
    <details class="more">
      <summary class="btn small">More ▾</summary>
      <div class="menu">
        <button class="btn small" id="exportMd" type="button">Export as Markdown</button>
        <button class="btn small" id="exportJson" type="button">Export as JSON</button>
        <label class="btn small">Import JSON<input type="file" id="import" accept="application/json,.json" hidden></label>
        <a class="btn small" href="options.html#backup">Backup &amp; restore</a>
        <button class="btn small danger" id="clear" type="button">Delete all</button>
      </div>
    </details>
  </div>
  <div class="filters" id="filters" hidden></div>
  <div class="layout">
    <div class="list" id="list"></div>
    <article class="reader" id="reader" aria-live="polite"><div class="reader-empty">Select a snippet to read it here.</div></article>
  </div>
</main>
<script src="../shared/config.js"></script>
<script src="../shared/markdown.js"></script>
<script src="../shared/prompts.js"></script>
<script src="../prompts/default.js"></script>
<script src="../shared/snippets.js"></script>
<script src="../shared/timeline.js"></script>
<script src="snippets.js"></script>
</body>
</html>
