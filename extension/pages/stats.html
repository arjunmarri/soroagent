<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stats · soroagent</title>
  <link rel="stylesheet" href="pages.css">
  <style>
    body { overflow-y: scroll; }
    main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
    .segmented button { border: none; background: none; padding: 7px 13px; font: inherit; font-size: 12.5px; color: var(--fg-muted); cursor: pointer; }
    .segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .tile-label { font-size: 12px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    .tile-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .tile-note { font-size: 12.5px; color: var(--fg-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px; }
    .panel h2 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .panel h2 small { font-weight: 400; color: var(--fg-muted); font-size: 12.5px; }

    /* Time per day: one series, bars anchored to the baseline */
    .chart { position: relative; height: 190px; margin: 6px 0 0 44px; }
    .grid-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); }
    .grid-line span { position: absolute; right: calc(100% + 8px); top: -8px; font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; }
    .bar { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; cursor: default; }
    .bar i { display: block; width: 100%; max-width: 44px; margin: 0 auto; background: var(--brand); border-radius: 4px 4px 0 0; min-height: 0; transition: filter .12s ease; }
    .bar.today i { background: var(--spark); }
    .bar:hover i, .bar:focus-visible i { filter: brightness(0.9); }
    .x-labels { display: flex; gap: 2px; margin-left: 44px; margin-top: 6px; }
    .x-labels span { flex: 1; min-width: 0; text-align: center; font-size: 11px; color: var(--fg-muted); white-space: nowrap; overflow: visible; }
    .x-labels span.today { color: var(--spark-fg); font-weight: 650; }
    .tip { position: fixed; z-index: 20; pointer-events: none; background: var(--fg); color: var(--bg); padding: 6px 9px; border-radius: 8px; font-size: 12px; line-height: 1.35; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
    .tip b { display: block; font-variant-numeric: tabular-nums; }

    .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; align-items: start; }
    @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
    .rows { display: grid; gap: 2px; }
    .site-row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 7px 8px; border-radius: 9px; border: 1px solid transparent; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; width: 100%; }
    .site-row:hover { background: var(--surface-soft); }
    .site-row[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .site-row .name { font-weight: 550; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .site-row .time { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
    .site-row .time small { color: var(--fg-muted); margin-left: 6px; }
    .meter { grid-column: 2 / 4; height: 5px; border-radius: 3px; background: var(--surface-soft); overflow: hidden; }
    .meter i { display: block; height: 100%; border-radius: 3px; background: var(--brand); }
    .avatar { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: #fff; }
    .page-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px; padding: 8px 8px; border-radius: 9px; }
    .page-row:hover { background: var(--surface-soft); }
    .page-row a { color: var(--fg); text-decoration: none; font-weight: 550; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page-row a:hover { color: var(--accent); text-decoration: underline; }
    .page-row small { grid-column: 1; color: var(--fg-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page-row .time { grid-row: 1 / 3; grid-column: 2; align-self: center; font-size: 13px; font-variant-numeric: tabular-nums; }
    .filter-note { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--fg-muted); margin: -4px 0 8px; }
    .empty { text-align: center; padding: 48px 16px; color: var(--fg-muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .foot-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--fg-muted); }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand"><picture><source srcset="../icons/dark/icon-48.png" media="(prefers-color-scheme: dark)"><img src="../icons/icon-48.png" alt=""></picture><span class="wordmark">soro<span>agent</span></span><span class="crumb">Stats</span></div>
    <div class="row"><a class="btn small" href="snippets.html">Snippets</a><a class="btn small" href="history.html">Summary history</a><a class="btn small" href="options.html#stats">Settings</a></div>
  </header>

  <div class="toolbar">
    <div class="segmented" role="group" aria-label="Time range">
      <button type="button" data-range="1" aria-pressed="false">Today</button>
      <button type="button" data-range="7" aria-pressed="true">7 days</button>
      <button type="button" data-range="30" aria-pressed="false">30 days</button>
      <button type="button" data-range="90" aria-pressed="false">90 days</button>
    </div>
    <span class="muted" id="off" hidden>Time tracking is off. <a href="options.html#stats">Turn it on in settings</a>.</span>
  </div>

  <div id="content"></div>

  <div class="foot-actions">
    <span>Counted only while a tab is in front and you're active (or media is playing). Stored only in this browser, for 90 days.</span>
    <button class="btn small danger" type="button" id="clear">Clear all stats</button>
  </div>
</main>
<footer class="site-foot">tech is art<span class="spark">.</span> © 2026 <a href="https://soroai.com" target="_blank" rel="noopener">soroai.com</a> · <a class="feedback-link" href="https://soroagent.com/feedback" target="_blank" rel="noopener">Share feedback</a></footer>
<script src="../shared/config.js"></script>
<script src="../shared/stats.js"></script>
<script src="stats.js"></script>
</body>
</html>
